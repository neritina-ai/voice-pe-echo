# voice-pe-echo 設定檔範例
# 複製一份並改名為 voice-pe-echo.toml（放在同一個資料夾），程式啟動時會自動讀取。
# 命令列參數的優先順序最高，其次是環境變數，最後才是這個檔案。
# 不需要的設定可以刪掉或留空，就會用預設值。

# Voice PE 的 IP 或主機名稱。留空 = 自動在區網搜尋（只有一台 Voice PE 時最方便）
host = ""

# API 加密金鑰（base64 字串，結尾通常是 "="）。
# 剛買來、沒加入過 Home Assistant 的 Voice PE 沒有金鑰，請留空。
# 只有加入過 Home Assistant 才需要填；取得方式見 docs/user-guide.md 附錄「取得加密金鑰」。
key = ""

# 播放用的輸出裝置：留空 = 系統預設喇叭；可填 run.bat --list-devices 列出的編號或名稱的一部分
output_device = ""

# 播放音量倍率（1.0 = 原始音量；程式預設會先把每句話調整到一致的音量）
volume = 1.0

# 播放結束後再忽略麥克風幾秒，用來防止回授。藍牙喇叭延遲較大，可調到 1.0~1.5
guard = 0.6

# 安靜多久算一句話說完（秒）。常被切成兩句就調大，例如 1.2
silence = 0.8

# 語音判斷門檻 0~1：背景聲音常誤觸發就調高（0.7）；小聲說話偵測不到就調低（0.3）
threshold = 0.5

# 每一句話另存成 WAV 檔的資料夾；留空 = 不存檔
save_dir = ""
